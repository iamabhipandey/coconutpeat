<!-- Page Header -->
<div class="mb-4">
    <h3 class="fw-bold text-dark mb-1">Personal Information</h3>
    <p class="text-muted">Manage your account settings and personal information</p>
</div>

<div class="row">
    <!-- Left Column: Profile Card & Security -->
    <div class="col-lg-4 col-md-12">
        <!-- Profile Widget -->
        <div class="card profile-widget mb-4">
            <div class="card-body p-0">
                <div class="profile-bg-gradient p-4 text-center rounded-top">
                    <div class="profile-user-img mb-3">
                        <img [src]="profileImageUrl" alt="Profile"
                            class="img-fluid rounded-circle border border-3 border-white">
                        <div class="profile-badge">
                            <span class="badge bg-primary rounded-circle p-2">AP</span>
                        </div>
                    </div>
                    <div class="profile-user-info text-white">
                        <h4 class="mb-1 text-white">Abhi Pandey</h4>
                        <p class="mb-3 opacity-75">Registered User</p>
                    </div>
                </div>
                <div class="p-4 text-center">
                    <button class="btn btn-primary d-inline-flex align-items-center mb-4 px-4 btn-rounded"
                        (click)="fileInput.click()">
                        <i class="feather icon-camera me-2"></i> Change Profile Photo
                        <input type="file" class="profile-upload-input" hidden #fileInput
                            (change)="onFileSelected($event)" accept="image/*">
                    </button>

                    <div class="social-links d-flex justify-content-center gap-2">
                        <a href="javascript:void(0);" class="social-btn facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="javascript:void(0);" class="social-btn google"><i class="fab fa-google"></i></a>
                        <a href="javascript:void(0);" class="social-btn twitter"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <!-- Right Column: Personal Information -->
    <div class="col-lg-8 col-md-12">
        <div class="card">
            <div class="card-body p-3">
                <div class="border-bottom pb-2 mb-3">
                    <h5 class="card-title mb-0 text-primary-dark">Personal Information</h5>
                </div>

                <form>
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">First Name</label>
                            <div class="input-group-clean">
                                <input type="text" class="form-control-clean" value="Abhi" placeholder="First Name">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Last Name</label>
                            <div class="input-group-clean">
                                <input type="text" class="form-control-clean" value="Pandey" placeholder="Last Name">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">User Name</label>
                            <div class="input-group-clean">
                                <input type="text" class="form-control-clean" value="abhishek_p"
                                    placeholder="User Name">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Tax/VAT Number</label>
                            <div class="input-group-clean">
                                <input type="text" class="form-control-clean text-muted" value="Not provided"
                                    placeholder="Tax/VAT Number">
                            </div>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label text-muted small fw-bold">Email Address</label>
                            <div class="d-flex align-items-center">
                                <span class="fw-medium me-2">abhishekpandeymail.com</span>
                                <span class="badge bg-success-light text-success d-flex align-items-center gap-1">
                                    <i class="feather icon-check-circle"></i> verified
                                </span>
                            </div>
                            <div class="border-bottom my-2"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Mobile Number</label>
                            <div class="input-group-clean">
                                <input type="text" class="form-control-clean fw-bold" value="+91 756767576"
                                    placeholder="Mobile Number">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">WhatsApp Number</label>
                            <div class="input-group-clean">
                                <input type="text" class="form-control-clean fw-bold" value="+91 756767576"
                                    placeholder="WhatsApp Number">
                            </div>
                        </div>



                        <div class="col-12 text-end mt-3">
                            <button type="submit" class="btn btn-primary btn-rounded px-4 mb-2">
                                <i class="feather icon-edit me-2"></i> Edit Profile
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
